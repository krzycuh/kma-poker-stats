spring:
  application:
    name: poker-stats-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pokerstats}
    username: ${DATABASE_USERNAME:pokerstats}
    password: ${DATABASE_PASSWORD:pokerstats}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    pl.kmazurek: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    audit: INFO

jwt:
  secret: changeme-this-is-a-development-secret-key-only-must-be-at-least-256-bits-long
  expiration-hours: 24  # hours
  refresh-expiration-days: 7  # days

ntfy:
  url: ${NTFY_URL:http://localhost:8090}
  topic: ${NTFY_TOPIC:pokerstats}
  token: ${NTFY_TOKEN:}
  enabled: ${NTFY_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5433/pokerstats_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6380

ntfy:
  enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${PORT:8080}

logging:
  level:
    pl.kmazurek: INFO
    org.springframework: INFO
    org.hibernate: INFO
    audit: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
